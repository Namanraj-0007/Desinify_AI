<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="ideGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#070b14" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020408" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="ideBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Frame Background -->
  <rect width="800" height="500" rx="16" fill="#020408" />
  <rect width="800" height="500" rx="16" fill="url(#ideGlow)" stroke="url(#ideBorder)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#0b0f19" fill-opacity="0.9" />
  <circle cx="28" cy="21" r="5" fill="#ef4444" />
  <circle cx="44" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />
  <text x="400" y="26" text-anchor="middle" fill="#94a3b8" font-size="12" class="mono">MONACO CODE GENERATOR • SSE STREAMING TSX</text>

  <!-- Action Bar Top Right -->
  <g transform="translate(560, 8)">
    <rect width="105" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="52" y="17" text-anchor="middle" fill="#cbd5e1" font-size="11" class="mono">📋 Copy TSX</text>

    <rect x="115" y="0" width="115" height="26" rx="6" fill="#6366f1" />
    <text x="172" y="17" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600" class="mono">⚡ Export ZIP</text>
  </g>

  <!-- Sub-Header Tabs -->
  <g transform="translate(30, 52)">
    <!-- Tab 1 Active -->
    <rect width="140" height="30" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8" />
    <text x="75" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600" class="mono">Component.tsx</text>

    <!-- Tab 2 -->
    <rect x="148" width="120" height="30" rx="6" fill="#070a13" stroke="#1e293b" stroke-width="1" />
    <text x="208" y="19" text-anchor="middle" fill="#64748b" font-size="11" class="mono">Tailwind.css</text>

    <!-- Tab 3 -->
    <rect x="276" width="120" height="30" rx="6" fill="#070a13" stroke="#1e293b" stroke-width="1" />
    <text x="336" y="19" text-anchor="middle" fill="#64748b" font-size="11" class="mono">Tokens.json</text>

    <!-- Stream Telemetry Badge -->
    <g transform="translate(520, 2)">
      <rect width="220" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <circle cx="14" cy="13" r="3.5" fill="#10b981" />
      <text x="120" y="17" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600" class="mono">STREAMING // 128 TOKENS/S</text>
    </g>
  </g>

  <!-- Code Editor Body -->
  <g transform="translate(30, 92)">
    <rect width="740" height="335" rx="10" fill="#050811" stroke="#1e293b" stroke-width="1" />

    <!-- Line Numbers Gutter -->
    <rect width="45" height="335" rx="10" fill="#0b0f19" />
    <g transform="translate(22, 25)" class="mono" font-size="11" fill="#475569" text-anchor="end">
      <text y="0">1</text>
      <text y="20">2</text>
      <text y="40">3</text>
      <text y="60">4</text>
      <text y="80">5</text>
      <text y="100">6</text>
      <text y="120">7</text>
      <text y="140">8</text>
      <text y="160">9</text>
      <text y="180">10</text>
      <text y="200">11</text>
      <text y="220">12</text>
      <text y="240">13</text>
      <text y="260">14</text>
      <text y="280">15</text>
    </g>

    <!-- Code Text with Syntax Coloring -->
    <g transform="translate(60, 25)" class="mono" font-size="11.5">
      <!-- Line 1 -->
      <text y="0" fill="#f43f5e">import</text>
      <text x="50" y="0" fill="#e2e8f0">React, { useState } </text>
      <text x="210" y="0" fill="#f43f5e">from</text>
      <text x="250" y="0" fill="#a5f3fc">'react'</text><text x="300" y="0" fill="#94a3b8">;</text>

      <!-- Line 2 -->
      <text y="20" fill="#f43f5e">import</text>
      <text x="50" y="20" fill="#e2e8f0">{ motion, AnimatePresence }</text>
      <text x="260" y="20" fill="#f43f5e">from</text>
      <text x="300" y="20" fill="#a5f3fc">'framer-motion'</text><text x="420" y="20" fill="#94a3b8">;</text>

      <!-- Line 4 -->
      <text y="60" fill="#38bdf8">export interface</text>
      <text x="140" y="60" fill="#fbbf24">NeuralWidgetProps</text>
      <text x="285" y="60" fill="#e2e8f0">{</text>

      <!-- Line 5 -->
      <text x="20" y="80" fill="#e2e8f0">title</text><text x="60" y="80" fill="#38bdf8">?: string;</text>
      <text x="170" y="80" fill="#64748b">// Inferred from Figma text node</text>

      <!-- Line 6 -->
      <text x="20" y="100" fill="#e2e8f0">accentColor</text><text x="105" y="100" fill="#38bdf8">?: string;</text>
      <text x="210" y="100" fill="#64748b">// Extracted fill token: #6366F1</text>

      <!-- Line 7 -->
      <text y="120" fill="#e2e8f0">}</text>

      <!-- Line 9 -->
      <text y="160" fill="#38bdf8">export const</text>
      <text x="110" y="160" fill="#fbbf24">NeuralWidget</text>
      <text x="215" y="160" fill="#e2e8f0">: React.FC&lt;</text><text x="310" y="160" fill="#fbbf24">NeuralWidgetProps</text><text x="455" y="160" fill="#e2e8f0">&gt; = ({</text>

      <!-- Line 10 -->
      <text x="20" y="180" fill="#e2e8f0">title = </text><text x="80" y="180" fill="#a5f3fc">"Neural Dashboard Widget"</text><text x="310" y="180" fill="#94a3b8">,</text>

      <!-- Line 11 -->
      <text y="200" fill="#e2e8f0">}) =&gt; {</text>

      <!-- Line 12 -->
      <text x="20" y="220" fill="#f43f5e">return</text>
      <text x="75" y="220" fill="#e2e8f0">(</text>

      <!-- Line 13 -->
      <text x="40" y="240" fill="#38bdf8">&lt;div</text>
      <text x="78" y="240" fill="#93c5fd">className</text><text x="145" y="240" fill="#94a3b8">=</text><text x="155" y="240" fill="#a5f3fc">"relative p-6 rounded-3xl bg-slate-900/90 border border-indigo-500/30"</text><text x="665" y="240" fill="#38bdf8">&gt;</text>

      <!-- Line 14 -->
      <text x="60" y="260" fill="#38bdf8">&lt;h3</text>
      <text x="88" y="260" fill="#93c5fd">className</text><text x="155" y="260" fill="#94a3b8">=</text><text x="165" y="260" fill="#a5f3fc">"text-2xl font-bold text-white font-display"</text><text x="500" y="260" fill="#38bdf8">&gt;</text><text x="510" y="260" fill="#e2e8f0">{title}</text><text x="568" y="260" fill="#38bdf8">&lt;/h3&gt;</text>

      <!-- Line 15 -->
      <text x="40" y="280" fill="#38bdf8">&lt;/div&gt;</text>
    </g>
  </g>

  <!-- Bottom Bar Info -->
  <g transform="translate(30, 440)">
    <rect width="740" height="38" rx="8" fill="#0b0f19" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" fill="#e2e8f0" font-size="12" class="sans"><tspan fill="#34d399" font-weight="bold">Feature 04</tspan> — Production-grade TypeScript 5.5 + Tailwind v3.4 code stream ready to copy or download as a Vite bundle.</text>
  </g>
</svg>

