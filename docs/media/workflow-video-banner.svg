<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="playGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="neonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="playBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: -0.03em; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="630" fill="#030712" />
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Isometric / Perspective Grid Floor -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="520" x2="1200" y2="520" />
    <line x1="0" y1="560" x2="1200" y2="560" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="100" y1="440" x2="0" y2="630" />
    <line x1="250" y1="440" x2="150" y2="630" />
    <line x1="400" y1="440" x2="350" y2="630" />
    <line x1="550" y1="440" x2="520" y2="630" />
    <line x1="650" y1="440" x2="680" y2="630" />
    <line x1="800" y1="440" x2="850" y2="630" />
    <line x1="950" y1="440" x2="1050" y2="630" />
    <line x1="1100" y1="440" x2="1200" y2="630" />
  </g>

  <!-- Main Player Container Frame -->
  <rect x="40" y="30" width="1120" height="570" rx="20" fill="#0b0f19" fill-opacity="0.8" stroke="url(#cyberBorder)" stroke-width="1.5" />

  <!-- Player Top Bar -->
  <g>
    <!-- Window Dots -->
    <circle cx="75" cy="65" r="6" fill="#ef4444" opacity="0.9" />
    <circle cx="95" cy="65" r="6" fill="#f59e0b" opacity="0.9" />
    <circle cx="115" cy="65" r="6" fill="#10b981" opacity="0.9" />

    <!-- File/Stream Indicator -->
    <rect x="145" y="52" width="230" height="26" rx="6" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
    <circle cx="160" cy="65" r="4" fill="#38bdf8" />
    <text x="175" y="69" fill="#94a3b8" font-size="12" class="mono">LIVE STREAM // 60 FPS</text>

    <!-- Top Center Title -->
    <text x="600" y="69" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600" class="sans" letter-spacing="0.05em">DESIGNIFY AI • SPATIAL COMPILER PIPELINE</text>

    <!-- Top Right Badges -->
    <rect x="945" y="52" width="90" height="26" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1" />
    <text x="990" y="69" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="600" class="mono">GEMINI 2.5</text>

    <rect x="1045" y="52" width="85" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="1087" y="69" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600" class="mono">FASTAPI SSE</text>
  </g>

  <!-- Player Content / Stage Mockup -->
  <!-- Left Side: Exploding Wireframe Layers Preview -->
  <g opacity="0.85">
    <!-- Base Canvas Plane -->
    <polygon points="200,280 440,200 440,360 200,440" fill="#1e1b4b" fill-opacity="0.35" stroke="#4338ca" stroke-width="1.5" />
    <!-- Layer 1 -->
    <polygon points="220,260 460,180 460,340 220,420" fill="#0f172a" fill-opacity="0.4" stroke="#6366f1" stroke-width="1.5" />
    <!-- Layer 2 (Neon Tagged) -->
    <polygon points="240,240 480,160 480,320 240,400" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.8" />
    <!-- Layer 3 (Top Button / Action) -->
    <polygon points="260,220 500,140 500,300 260,380" fill="#ec4899" fill-opacity="0.1" stroke="#f472b6" stroke-width="2" />

    <!-- Connecting Rays -->
    <line x1="200" y1="280" x2="260" y2="220" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="440" y1="200" x2="500" y2="140" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="440" y1="360" x2="500" y2="300" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <line x1="200" y1="440" x2="260" y2="380" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Floating Spatial Tag -->
    <rect x="360" y="150" width="110" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="415" y="166" text-anchor="middle" fill="#38bdf8" font-size="11" class="mono">&lt;motion.div&gt;</text>
  </g>

  <!-- Right Side: Streamed React Code Terminal Preview -->
  <g transform="translate(680, 130)">
    <rect width="440" height="340" rx="12" fill="#030712" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" />
    <rect width="440" height="32" rx="12" fill="#0f172a" fill-opacity="0.9" />
    <!-- Tabs -->
    <rect x="12" y="6" width="130" height="22" rx="4" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
    <text x="77" y="21" text-anchor="middle" fill="#c7d2fe" font-size="11" class="mono">HeroCard.tsx</text>
    <text x="180" y="21" fill="#64748b" font-size="11" class="mono">Tailwind.css</text>
    <text x="270" y="21" fill="#64748b" font-size="11" class="mono">Tokens.json</text>

    <!-- Code Snippet -->
    <g transform="translate(20, 55)" class="mono" font-size="12">
      <text y="0" fill="#f43f5e">import</text>
      <text x="50" y="0" fill="#e2e8f0">React, { useState } </text>
      <text x="210" y="0" fill="#f43f5e">from</text>
      <text x="250" y="0" fill="#a5f3fc">'react'</text><text x="300" y="0" fill="#94a3b8">;</text>

      <text y="24" fill="#f43f5e">import</text>
      <text x="50" y="24" fill="#e2e8f0">{ motion }</text>
      <text x="130" y="24" fill="#f43f5e">from</text>
      <text x="170" y="24" fill="#a5f3fc">'framer-motion'</text><text x="275" y="24" fill="#94a3b8">;</text>

      <text y="58" fill="#38bdf8">export interface</text>
      <text x="140" y="58" fill="#fbbf24">CardProps</text>
      <text x="215" y="58" fill="#e2e8f0">{</text>
      <text x="20" y="80" fill="#e2e8f0">title</text><text x="60" y="80" fill="#38bdf8">?: string;</text>
      <text x="20" y="100" fill="#e2e8f0">metrics</text><text x="78" y="100" fill="#38bdf8">?: number[];</text>
      <text y="122" fill="#e2e8f0">}</text>

      <text y="156" fill="#38bdf8">export function</text>
      <text x="130" y="156" fill="#fbbf24">HeroCard</text><text x="195" y="156" fill="#e2e8f0">({ title }: </text><text x="275" y="156" fill="#fbbf24">CardProps</text><text x="345" y="156" fill="#e2e8f0">) {</text>

      <text x="20" y="186" fill="#f43f5e">return</text>
      <text x="75" y="186" fill="#e2e8f0">(</text>
      <text x="40" y="210" fill="#38bdf8">&lt;div</text>
      <text x="78" y="210" fill="#93c5fd">className</text><text x="145" y="210" fill="#94a3b8">=</text><text x="155" y="210" fill="#a5f3fc">"relative p-6 rounded-3xl</text>
      <text x="60" y="232" fill="#a5f3fc">bg-slate-900/90 border-cyan-500/20"&gt;</text>
      <text x="40" y="254" fill="#38bdf8">&lt;/div&gt;</text>
      <text x="20" y="274" fill="#e2e8f0">);</text>
    </g>
  </g>

  <!-- Large Central Video Play Trigger Button -->
  <g transform="translate(600, 310)">
    <!-- Radial Outer Pulsing Ring -->
    <circle cx="0" cy="0" r="80" fill="url(#playGlow)" />
    <circle cx="0" cy="0" r="56" fill="#0f172a" fill-opacity="0.9" stroke="url(#cyberBorder)" stroke-width="2.5" filter="url(#glowFilter)" />
    <circle cx="0" cy="0" r="44" fill="url(#playBtnGrad)" />

    <!-- Play Arrow Icon -->
    <polygon points="-8,-16 16,0 -8,16" fill="#ffffff" />
  </g>

  <!-- Video Meta Overlay: Title & Subtitle -->
  <g transform="translate(100, 480)">
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" class="mono" letter-spacing="0.1em">WALKTHROUGH DEMO • 02:30</text>
    <text x="0" y="30" fill="#ffffff" font-size="26" class="sans title">Figma Vector Frame to Production React 19 in 12s</text>
    <text x="0" y="55" fill="#94a3b8" font-size="14" class="sans">Watch the Gemini 2.5 Flash multimodal vision engine extract tokens &amp; compile typed TSX live</text>
  </g>

  <!-- Player Bottom Control Scrubber Bar -->
  <g transform="translate(60, 560)">
    <!-- Background Rail -->
    <rect width="1080" height="6" rx="3" fill="#1e293b" />
    <!-- Active Progress Bar -->
    <rect width="440" height="6" rx="3" fill="url(#neonBar)" />
    <!-- Scrubber Handle -->
    <circle cx="440" cy="3" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="2" filter="url(#glowFilter)" />

    <!-- Time Indicators -->
    <text x="0" y="24" fill="#94a3b8" font-size="11" class="mono">01:04 / 02:30</text>
    <text x="320" y="24" fill="#38bdf8" font-size="11" class="mono">▲ CHAPTER 03: GEMINI AST REASONING</text>
    <text x="1080" y="24" text-anchor="end" fill="#64748b" font-size="11" class="mono">1080p • 60 FPS • SSE STREAM</text>
  </g>
</svg>

