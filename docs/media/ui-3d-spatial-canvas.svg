<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="scGlow" cx="45%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020408" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="scBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Frame Background -->
  <rect width="800" height="500" rx="16" fill="#020408" />
  <rect width="800" height="500" rx="16" fill="url(#scGlow)" stroke="url(#scBorder)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#0b0f19" fill-opacity="0.9" />
  <circle cx="28" cy="21" r="5" fill="#ef4444" />
  <circle cx="44" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />
  <text x="400" y="26" text-anchor="middle" fill="#94a3b8" font-size="12" class="mono">3D SPATIAL CANVAS • THREE.JS / R3F EXPLODED VIEWPORT</text>

  <!-- Telemetry Overlay Top Right -->
  <g transform="translate(620, 56)">
    <rect width="160" height="70" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="12" y="20" fill="#38bdf8" font-size="10" class="mono">CAM: [0.0, 0.0, 6.8]</text>
    <text x="12" y="36" fill="#a855f7" font-size="10" class="mono">TILT: [-0.22, 0.48, 0.06]</text>
    <text x="12" y="52" fill="#10b981" font-size="10" class="mono">FOV: 42° • SCROLL: 0.42</text>
  </g>

  <!-- 3D Perspective Grid Floor -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="450" x2="700" y2="450" />
    <line x1="150" y1="410" x2="650" y2="410" />
    <line x1="200" y1="375" x2="600" y2="375" />
    <line x1="240" y1="345" x2="560" y2="345" />

    <line x1="100" y1="450" x2="280" y2="320" />
    <line x1="250" y1="450" x2="350" y2="320" />
    <line x1="400" y1="450" x2="400" y2="320" />
    <line x1="550" y1="450" x2="450" y2="320" />
    <line x1="700" y1="450" x2="520" y2="320" />
  </g>

  <!-- Exploded 3D Isometric Layers -->
  <g transform="translate(40, -10)">
    <!-- Layer 00: Base Artboard Frame (Z = 0.00) -->
    <polygon points="220,330 460,210 460,370 220,490" fill="#090d16" fill-opacity="0.7" stroke="#334155" stroke-width="1.5" />
    <text x="340" y="380" fill="#475569" font-size="11" class="mono" text-anchor="middle">LAYER 00: ARTBOARD BASE (Z=0.00)</text>

    <!-- Layer 01: Flex Navigation (Z = +0.45) -->
    <polygon points="235,300 475,180 475,340 235,460" fill="#1e1b4b" fill-opacity="0.45" stroke="#6366f1" stroke-width="1.5" />
    <text x="490" y="270" fill="#818cf8" font-size="11" class="mono">&lt;nav.flex-row&gt;</text>

    <!-- Layer 02: Metric Telemetry Cards (Z = +0.95) -->
    <polygon points="250,270 490,150 490,310 250,430" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.8" />
    <text x="510" y="235" fill="#38bdf8" font-size="11" class="mono">&lt;grid.cols-2&gt;</text>

    <!-- Layer 03: Sparkline Graphs (Z = +1.45) -->
    <polygon points="265,240 505,120 505,280 265,400" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="1.8" />
    <text x="525" y="200" fill="#34d399" font-size="11" class="mono">&lt;svg.sparkline&gt;</text>

    <!-- Layer 04: Interactive CTA Button (Z = +1.95) -->
    <polygon points="280,210 520,90 520,250 280,370" fill="#a21caf" fill-opacity="0.25" stroke="#ec4899" stroke-width="2" />
    <text x="540" y="165" fill="#f472b6" font-size="11" class="mono">&lt;button:hover&gt;</text>

    <!-- Neon Connecting Vector Rays linking corners -->
    <line x1="220" y1="330" x2="280" y2="210" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8" filter="url(#neonGlow)" />
    <line x1="460" y1="210" x2="520" y2="90" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8" filter="url(#neonGlow)" />
    <line x1="460" y1="370" x2="520" y2="250" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8" filter="url(#neonGlow)" />
    <line x1="220" y1="490" x2="280" y2="370" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8" filter="url(#neonGlow)" />
  </g>

  <!-- Left Side Badges / HUD -->
  <g transform="translate(30, 70)">
    <rect width="180" height="130" rx="8" fill="#0b0f19" fill-opacity="0.85" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="24" fill="#e2e8f0" font-size="12" font-weight="700" class="sans">Visual AST Deconstruct</text>
    <text x="14" y="46" fill="#94a3b8" font-size="11" class="sans">• 6 Spatial Meshes</text>
    <text x="14" y="66" fill="#94a3b8" font-size="11" class="sans">• Cubic Damping (λ=0.22)</text>
    <text x="14" y="86" fill="#94a3b8" font-size="11" class="sans">• Z-Separation: 0.75m</text>
    <text x="14" y="106" fill="#38bdf8" font-size="11" class="mono">status: EXPLODED</text>
  </g>

  <!-- Bottom Bar Info -->
  <g transform="translate(30, 440)">
    <rect width="740" height="38" rx="8" fill="#0b0f19" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" fill="#e2e8f0" font-size="12" class="sans"><tspan fill="#38bdf8" font-weight="bold">Feature 01</tspan> — WebGL spatial engine deconstructs nested Figma hierarchies along the Z-axis in real time.</text>
  </g>
</svg>
