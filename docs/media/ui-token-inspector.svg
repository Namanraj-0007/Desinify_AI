<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="tokenGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#0b0f19" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="tkBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Frame Background -->
  <rect width="800" height="500" rx="16" fill="#030712" />
  <rect width="800" height="500" rx="16" fill="url(#tokenGlow)" stroke="url(#tkBorder)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#0b0f19" fill-opacity="0.9" />
  <circle cx="28" cy="21" r="5" fill="#ef4444" />
  <circle cx="44" cy="21" r="5" fill="#f59e0b" />
  <circle cx="60" cy="21" r="5" fill="#10b981" />
  <text x="400" y="26" text-anchor="middle" fill="#94a3b8" font-size="12" class="mono">FIGMA REST API v1 • DESIGN TOKEN &amp; AST INSPECTOR</text>

  <!-- Left Column: AST Node Hierarchy Tree -->
  <g transform="translate(30, 56)">
    <rect width="350" height="365" rx="10" fill="#070a13" stroke="#1e293b" stroke-width="1" />
    <!-- Header -->
    <rect width="350" height="32" rx="10" fill="#0f172a" />
    <text x="14" y="21" fill="#cbd5e1" font-size="11" font-weight="600" class="sans">AST VECTOR HIERARCHY</text>
    <text x="336" y="21" text-anchor="end" fill="#38bdf8" font-size="10" class="mono">14 NODES</text>

    <!-- Tree Nodes -->
    <g transform="translate(16, 52)" class="mono" font-size="11">
      <!-- Node 1 -->
      <circle cx="6" cy="4" r="3.5" fill="#6366f1" />
      <text x="18" y="8" fill="#e2e8f0">&lt;DOCUMENT&gt;</text>

      <!-- Node 2 -->
      <line x1="6" y1="12" x2="6" y2="40" stroke="#334155" stroke-width="1" />
      <line x1="6" y1="40" x2="22" y2="40" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="40" r="3.5" fill="#38bdf8" />
      <text x="40" y="44" fill="#38bdf8">&lt;FRAME#HeroArtboard&gt;</text>
      <text x="230" y="44" fill="#64748b" font-size="9">1440×900</text>

      <!-- Node 3 -->
      <line x1="28" y1="48" x2="28" y2="76" stroke="#334155" stroke-width="1" />
      <line x1="28" y1="76" x2="44" y2="76" stroke="#334155" stroke-width="1" />
      <circle cx="50" cy="76" r="3.5" fill="#ec4899" />
      <text x="62" y="80" fill="#f472b6">&lt;AUTO_LAYOUT: HORIZONTAL&gt;</text>
      <text x="250" y="80" fill="#64748b" font-size="9">gap: 16</text>

      <!-- Node 4 -->
      <line x1="50" y1="84" x2="50" y2="112" stroke="#334155" stroke-width="1" />
      <line x1="50" y1="112" x2="66" y2="112" stroke="#334155" stroke-width="1" />
      <circle cx="72" cy="112" r="3.5" fill="#10b981" />
      <text x="84" y="116" fill="#34d399">&lt;TEXT: "Neural Engine"&gt;</text>
      <text x="235" y="116" fill="#64748b" font-size="9">Inter 700</text>

      <!-- Node 5 -->
      <line x1="50" y1="120" x2="50" y2="148" stroke="#334155" stroke-width="1" />
      <line x1="50" y1="148" x2="66" y2="148" stroke="#334155" stroke-width="1" />
      <circle cx="72" cy="148" r="3.5" fill="#f59e0b" />
      <text x="84" y="152" fill="#fbbf24">&lt;RECTANGLE: BadgeBackground&gt;</text>

      <!-- Node 6 -->
      <line x1="28" y1="84" x2="28" y2="184" stroke="#334155" stroke-width="1" />
      <line x1="28" y1="184" x2="44" y2="184" stroke="#334155" stroke-width="1" />
      <circle cx="50" cy="184" r="3.5" fill="#8b5cf6" />
      <text x="62" y="188" fill="#a78bfa">&lt;VECTOR: SparklineCurve&gt;</text>
      <text x="230" y="188" fill="#64748b" font-size="9">Path Data</text>

      <!-- Node 7 (CTA Button) -->
      <line x1="28" y1="192" x2="28" y2="220" stroke="#334155" stroke-width="1" />
      <line x1="28" y1="220" x2="44" y2="220" stroke="#334155" stroke-width="1" />
      <circle cx="50" cy="220" r="3.5" fill="#ef4444" />
      <text x="62" y="224" fill="#f87171">&lt;FRAME: PrimaryCTAButton&gt;</text>
      <text x="250" y="224" fill="#64748b" font-size="9">r: 12px</text>
    </g>

    <!-- AST Status Footer -->
    <g transform="translate(16, 320)">
      <rect width="318" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="19" fill="#10b981" font-size="10" class="mono">✓ 100% Autolayout Mapped to Flex/Grid</text>
    </g>
  </g>

  <!-- Right Column: Extracted Design Tokens -->
  <g transform="translate(410, 56)">
    <rect width="360" height="365" rx="10" fill="#070a13" stroke="#1e293b" stroke-width="1" />
    <!-- Header -->
    <rect width="360" height="32" rx="10" fill="#0f172a" />
    <text x="14" y="21" fill="#cbd5e1" font-size="11" font-weight="600" class="sans">EXTRACTED DESIGN TOKENS</text>
    <text x="346" y="21" text-anchor="end" fill="#a855f7" font-size="10" class="mono">Tokens.json</text>

    <!-- Swatches Section -->
    <g transform="translate(18, 48)">
      <text x="0" y="0" fill="#94a3b8" font-size="10" font-weight="600" class="mono">COLOR PALETTE (EXACT FILLS)</text>
      <g transform="translate(0, 10)">
        <!-- Swatch 1 -->
        <rect x="0" y="0" width="32" height="32" rx="6" fill="#030712" stroke="#334155" stroke-width="1" />
        <text x="40" y="16" fill="#ffffff" font-size="11" class="mono">#030712</text>
        <text x="40" y="28" fill="#64748b" font-size="9" class="sans">Surface / Canvas</text>

        <!-- Swatch 2 -->
        <rect x="170" y="0" width="32" height="32" rx="6" fill="#6366f1" stroke="#334155" stroke-width="1" />
        <text x="210" y="16" fill="#ffffff" font-size="11" class="mono">#6366F1</text>
        <text x="210" y="28" fill="#64748b" font-size="9" class="sans">Primary Indigo</text>

        <!-- Swatch 3 -->
        <rect x="0" y="42" width="32" height="32" rx="6" fill="#38bdf8" stroke="#334155" stroke-width="1" />
        <text x="40" y="58" fill="#ffffff" font-size="11" class="mono">#38BDF8</text>
        <text x="40" y="70" fill="#64748b" font-size="9" class="sans">Accent Cyan</text>

        <!-- Swatch 4 -->
        <rect x="170" y="42" width="32" height="32" rx="6" fill="#10b981" stroke="#334155" stroke-width="1" />
        <text x="210" y="58" fill="#ffffff" font-size="11" class="mono">#10B981</text>
        <text x="210" y="70" fill="#64748b" font-size="9" class="sans">Success Emerald</text>
      </g>
    </g>

    <!-- Typography & Spacing Scale -->
    <g transform="translate(18, 175)">
      <text x="0" y="0" fill="#94a3b8" font-size="10" font-weight="600" class="mono">TYPOGRAPHY &amp; SPACING SCALES</text>
      <rect x="0" y="10" width="324" height="130" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <g transform="translate(12, 30)" class="mono" font-size="11">
        <text y="0" fill="#e2e8f0">fontFamily: <tspan fill="#38bdf8">"Inter", sans-serif</tspan></text>
        <text y="22" fill="#e2e8f0">titleDisplay: <tspan fill="#ec4899">28px / 700 / -0.02em</tspan></text>
        <text y="44" fill="#e2e8f0">bodyMedium: <tspan fill="#a855f7">14px / 400 / 1.5</tspan></text>
        <text y="66" fill="#e2e8f0">paddingUnit: <tspan fill="#10b981">24px (p-6)</tspan></text>
        <text y="88" fill="#e2e8f0">borderRadius: <tspan fill="#f59e0b">24px (rounded-3xl)</tspan></text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar Info -->
  <g transform="translate(30, 440)">
    <rect width="740" height="38" rx="8" fill="#0b0f19" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" fill="#e2e8f0" font-size="12" class="sans"><tspan fill="#ec4899" font-weight="bold">Feature 03</tspan> — Exact vector node tree extraction with zero hallucinated coordinates or rogue styles.</text>
  </g>
</svg>

